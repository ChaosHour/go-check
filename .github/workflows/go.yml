name: Release CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.2'
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o go-check-linux-amd64 ./main.go
          GOOS=darwin GOARCH=amd64 go build -o go-check-darwin-intel ./main.go
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-check-linux-amd64
            go-check-darwin-intel
          token: ${{ secrets.GITHUB_TOKEN }}
